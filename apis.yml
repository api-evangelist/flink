aid: flink
name: Apache Flink
description: Apache Flink is an open-source framework and distributed processing engine for stateful computations over unbounded
  and bounded data streams. It is designed to run in all common cluster environments and to perform computations at in-memory
  speed and at any scale. Flink exposes a REST API on the JobManager Dispatcher that allows external systems to query cluster
  status, submit and manage jobs, trigger savepoints and checkpoints, upload and run JARs, and inspect metrics, accumulators,
  and exception histories. The same REST endpoints power the Flink Web UI.
