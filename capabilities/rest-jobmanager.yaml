naftiko: 1.0.0-alpha2
info:
  label: Apache Flink REST API — JobManager
  description: 'Apache Flink REST API — JobManager. 5 operations. Lead operation: Cluster configuration. Self-contained Naftiko
    capability covering one Flink business surface.'
  tags:
  - Flink
  - JobManager
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FLINK_API_KEY: FLINK_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-jobmanager
    baseUri: http://localhost:8081
    description: Apache Flink REST API — JobManager business capability. Self-contained, no shared references.
    resources:
    - name: jobmanager-config
      path: /jobmanager/config
      operations:
      - name: getjobmanagerconfig
        method: GET
        description: Cluster configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobmanager-environment
      path: /jobmanager/environment
      operations:
      - name: getjobmanagerenvironment
        method: GET
        description: JobManager environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobmanager-logs
      path: /jobmanager/logs
      operations:
      - name: listjobmanagerlogs
        method: GET
        description: List JobManager log files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobmanager-metrics
      path: /jobmanager/metrics
      operations:
      - name: getjobmanagermetrics
        method: GET
        description: JobManager metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: get
          in: query
          type: string
          description: Comma-separated metric names.
    - name: jobmanager-thread-dump
      path: /jobmanager/thread-dump
      operations:
      - name: getjobmanagerthreaddump
        method: GET
        description: JobManager thread dump
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: rest-jobmanager-rest
    port: 8080
    description: REST adapter for Apache Flink REST API — JobManager. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/jobmanager/config
      name: jobmanager-config
      description: REST surface for jobmanager-config.
      operations:
      - method: GET
        name: getjobmanagerconfig
        description: Cluster configuration
        call: rest-jobmanager.getjobmanagerconfig
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobmanager/environment
      name: jobmanager-environment
      description: REST surface for jobmanager-environment.
      operations:
      - method: GET
        name: getjobmanagerenvironment
        description: JobManager environment
        call: rest-jobmanager.getjobmanagerenvironment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobmanager/logs
      name: jobmanager-logs
      description: REST surface for jobmanager-logs.
      operations:
      - method: GET
        name: listjobmanagerlogs
        description: List JobManager log files
        call: rest-jobmanager.listjobmanagerlogs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobmanager/metrics
      name: jobmanager-metrics
      description: REST surface for jobmanager-metrics.
      operations:
      - method: GET
        name: getjobmanagermetrics
        description: JobManager metrics
        call: rest-jobmanager.getjobmanagermetrics
        with:
          get: rest.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobmanager/thread-dump
      name: jobmanager-thread-dump
      description: REST surface for jobmanager-thread-dump.
      operations:
      - method: GET
        name: getjobmanagerthreaddump
        description: JobManager thread dump
        call: rest-jobmanager.getjobmanagerthreaddump
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-jobmanager-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Flink REST API — JobManager. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: cluster-configuration
      description: Cluster configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-jobmanager.getjobmanagerconfig
      outputParameters:
      - type: object
        mapping: $.
    - name: jobmanager-environment
      description: JobManager environment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-jobmanager.getjobmanagerenvironment
      outputParameters:
      - type: object
        mapping: $.
    - name: list-jobmanager-log-files
      description: List JobManager log files
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-jobmanager.listjobmanagerlogs
      outputParameters:
      - type: object
        mapping: $.
    - name: jobmanager-metrics
      description: JobManager metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-jobmanager.getjobmanagermetrics
      with:
        get: tools.get
      outputParameters:
      - type: object
        mapping: $.
    - name: jobmanager-thread-dump
      description: JobManager thread dump
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-jobmanager.getjobmanagerthreaddump
      outputParameters:
      - type: object
        mapping: $.
