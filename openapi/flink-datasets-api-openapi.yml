openapi: 3.1.0
info:
  title: Apache Flink REST Checkpoints Datasets API
  description: The Flink REST API is exposed by the JobManager Dispatcher and provides monitoring and management capabilities for a Flink cluster. It covers cluster configuration, JobManager environment and metrics, job lifecycle (submit, list, cancel, stop), checkpoint and savepoint management, JAR upload and execution, dataset operations, and TaskManager inspection.
  version: v1
  contact:
    name: Apache Flink
    url: https://flink.apache.org/community/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8081
  description: Default JobManager Dispatcher endpoint
tags:
- name: Datasets
  description: Cluster dataset listing and deletion.
paths:
  /datasets:
    get:
      tags:
      - Datasets
      summary: List cluster datasets
      operationId: listDatasets
      responses:
        '200':
          description: Available cluster datasets.
  /datasets/{datasetid}:
    delete:
      tags:
      - Datasets
      summary: Delete a cluster dataset
      operationId: deleteDataset
      parameters:
      - in: path
        name: datasetid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dataset deleted.
